<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:600px;overflow:hidden;font-family:"Helvetica Neue",Arial,sans-serif;color:#e8f1ff;
background:radial-gradient(circle at 78% 30%,rgba(26,163,255,.35),transparent 45%),radial-gradient(circle at 10% 100%,rgba(11,74,158,.5),transparent 50%),linear-gradient(135deg,#030712,#0a1630);position:relative}
.stripe{position:absolute;background:linear-gradient(90deg,#0b4a9e,#1aa3ff);transform:skewX(-35deg);box-shadow:0 0 30px #1aa3ff}
.s1{width:420px;height:26px;left:-60px;top:70px}.s2{width:220px;height:14px;left:60px;top:110px;opacity:.6}
.s3{width:520px;height:26px;right:-80px;bottom:70px}.s4{width:260px;height:14px;right:40px;bottom:110px;opacity:.6}
.logo{position:absolute;right:170px;top:90px;width:420px;height:420px;border-radius:50%;box-shadow:0 0 60px #1aa3ff,0 0 140px rgba(26,163,255,.4)}
.text{position:absolute;left:150px;top:150px}
.eyebrow{color:#1aa3ff;letter-spacing:.4em;text-transform:uppercase;font-size:28px;font-weight:600}
h1{font-size:170px;font-style:italic;font-weight:900;line-height:1.05;text-shadow:0 0 30px rgba(26,163,255,.4)}
h1 span{color:#1aa3ff;text-shadow:0 0 40px #1aa3ff}
p{font-size:38px;color:#8da4c8;margin-top:10px}
</style></head><body>
<div class="stripe s1"></div><div class="stripe s2"></div><div class="stripe s3"></div><div class="stripe s4"></div>
<div class="text"><div class="eyebrow">Unity Asset Store Publisher</div><h1>imorz<span>_y</span></h1><p>Game-ready assets. Plug &amp; play.</p></div>
<img class="logo" src="../assets/logo.webp">
</body></html>
