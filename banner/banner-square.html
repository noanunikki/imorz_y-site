<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1024px;height:1024px;overflow:hidden;font-family:"Helvetica Neue",Arial,sans-serif;color:#e8f1ff;text-align:center;
background:radial-gradient(circle at 50% 30%,rgba(26,163,255,.35),transparent 50%),radial-gradient(circle at 0% 100%,rgba(11,74,158,.5),transparent 50%),linear-gradient(160deg,#030712,#0a1630);position:relative}
.stripe{position:absolute;background:linear-gradient(90deg,#0b4a9e,#1aa3ff);transform:skewX(-35deg);box-shadow:0 0 30px #1aa3ff}
.s1{width:300px;height:20px;left:-60px;top:60px}.s2{width:160px;height:10px;left:40px;top:92px;opacity:.6}
.s3{width:340px;height:20px;right:-80px;bottom:60px}.s4{width:180px;height:10px;right:30px;bottom:92px;opacity:.6}
.logo{width:420px;height:420px;border-radius:50%;margin-top:90px;box-shadow:0 0 60px #1aa3ff,0 0 140px rgba(26,163,255,.4)}
.eyebrow{color:#1aa3ff;letter-spacing:.35em;text-transform:uppercase;font-size:26px;font-weight:600;margin-top:50px}
h1{font-size:140px;font-style:italic;font-weight:900;line-height:1.1;text-shadow:0 0 30px rgba(26,163,255,.4)}
h1 span{color:#1aa3ff;text-shadow:0 0 40px #1aa3ff}
p{font-size:34px;color:#8da4c8}
</style></head><body>
<div class="stripe s1"></div><div class="stripe s2"></div><div class="stripe s3"></div><div class="stripe s4"></div>
<img class="logo" src="../assets/logo.webp">
<div class="eyebrow">Unity Asset Store Publisher</div><h1>imorz<span>_y</span></h1><p>Game-ready assets. Plug &amp; play.</p>
</body></html>
